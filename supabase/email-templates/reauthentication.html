<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#efebe5;font-family:Arial,Helvetica,sans-serif;color:#171717;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">
      Your Odd Wheels verification code.
    </div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#efebe5;">
      <tr>
        <td align="center" style="padding:24px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#111111;border:1px solid #2e2a27;border-radius:18px;overflow:hidden;">
            <tr>
              <td style="padding:28px 28px 20px;border-top:6px solid #c86a24;">
                <div style="font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:#f1c5a1;margin-bottom:12px;">
                  Odd Wheels
                </div>
                <div style="font-size:28px;line-height:1.2;font-weight:700;color:#ffffff;margin:0 0 12px;">
                  Verification code
                </div>
                <div style="font-size:15px;line-height:1.7;color:#d1ccc6;">
                  Enter this code to complete a sensitive action on your Odd Wheels account.
                </div>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:8px 28px 10px;">
                <div style="display:inline-block;padding:14px 22px;border:1px solid #4b443f;border-radius:16px;background:#181818;font-size:28px;letter-spacing:0.28em;font-weight:700;color:#ffffff;">
                  {{ .Token }}
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 28px 28px;font-size:13px;line-height:1.7;color:#a9a29b;">
                If you did not request this code, secure your account and change your password.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
